name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./agent/ ./ai/ ./gateway/ ./cmd/omega/
      - run: go test ./agent/ ./ai/ ./gateway/ ./cmd/omega/