name: CI

on:
  push:
    branches: [master, dev]
    # ponytail: docs-only pushes skip CI (minutes back). The drift gate
    # lives in its own workflow (drift.yml) and still measures every push,
    # docs pushes included.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...
      - name: Binary-purity canary (scripts/nm-purity.sh - the kanban module must never survive its own removal build)
        run: scripts/nm-purity.sh
      - name: Shell scratch-repo suite (drift gate + release suggest + release notes + purity negatives + checksum emission + the git fence + dependency drift)
        run: |
          bash scripts/drift-gate_test.sh
          bash scripts/release-suggest_test.sh
          bash scripts/release-notes_test.sh
          bash scripts/release-checksums_test.sh
          bash scripts/nm-purity_test.sh
          bash scripts/fence-test.sh
          bash scripts/dep-drift_test.sh
      - name: Recipe determinism (scripts/recipe-lint.sh over scripts/journeys/recipes - no fixed sleeps, no fixed windows in front of a read)
        run: bash scripts/recipe-lint_test.sh
      # sweep_chromes_win_test.sh (needs powershell.exe) and orphan_test.sh
      # (needs the bundled chromium) exit 0 as SKIP on this host, and a suite
      # that skips asserts nothing - they belong to the Windows/Pi lanes.
      # sweep_daemons_test.sh stays out until sweep-daemons.sh reads Linux
      # netstat: client_attached() parses the Windows shape (uppercase TCP,
      # state in column 4) and this host prints lowercase tcp with the state
      # in column 6, so a live ESTABLISHED session reads as idle and closes.
      - name: Journeys witness suites (the suite's own budgets, REST/browser deadlines, run lock and console scope - stub browser, stub lane, no live chrome)
        run: |
          bash scripts/journeys/clock_test.sh
          bash scripts/journeys/console_scope_test.sh
          bash scripts/journeys/runlock_test.sh
