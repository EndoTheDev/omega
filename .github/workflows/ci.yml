name: CI

on:
  push:
    branches: [master, dev]
    # ponytail: docs-only pushes skip CI (minutes back). The drift gate
    # lives in its own workflow (drift.yml) and still measures every push,
    # docs pushes included.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...
      - name: Binary-purity canary (scripts/nm-purity.sh - the kanban module must never survive its own removal build)
        run: scripts/nm-purity.sh
      - name: Shell scratch-repo suite (drift gate + release suggest + purity negatives)
        run: |
          bash scripts/drift-gate_test.sh
          bash scripts/release-suggest_test.sh
          bash scripts/nm-purity_test.sh