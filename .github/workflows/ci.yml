name: CI

on:
  push:
    branches: [master, dev]
    # ponytail: docs-only pushes skip CI (minutes back). Tradeoff named:
    # the drift gate also skips those pushes - drift state stays as of the
    # last code push, next code push restores it. Acceptable during soak.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...
      - name: Shell scratch-repo suite (drift gate + release suggest)
        run: |
          bash scripts/drift-gate_test.sh
          bash scripts/release-suggest_test.sh

  drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drift gate (FAIL RED when dev is over 10 commits or over 7 days ahead of master)
        run: scripts/drift-gate.sh