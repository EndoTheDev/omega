name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...

  drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure drift vs master (report-only)
        run: |
          commits=$(git rev-list --count origin/master..HEAD)
          mb=$(git merge-base origin/master HEAD)
          mb_ct=$(git log -1 --format=%ct "$mb")
          head_ct=$(git log -1 --format=%ct HEAD)
          days=$(( (head_ct - mb_ct) / 86400 ))
          echo "drift: $commits commits ahead of master, $days days since last sync"
          {
            echo "## Drift vs master (reported, not enforced)"
            echo ""
            echo "| metric | value |"
            echo "|--------|-------|"
            echo "| commits ahead of master | $commits |"
            echo "| days since last sync from master | $days |"
            echo "| merge-base | \`$mb\` |"
            echo ""
            echo "Hard-fail thresholds (10 commits / 7 days) arrive with the nightly-channel card."
          } >> "$GITHUB_STEP_SUMMARY"