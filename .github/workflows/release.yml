name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # full history + all tags: the release notes need the commit range
        # back to the previous stable tag and the tag annotation reads off
        # the checked-out tag object
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Determine version
        id: version
        # nightly tags (vX.Y.Z-nightly.*) ride the prerelease flag: they
        # sort BELOW their stable target and GitHub keeps them out of the
        # "Latest" release the updater's stable channel reads.
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PRERELEASE=false
          case "$VERSION" in *-nightly.*) PRERELEASE=true ;; esac
          {
            echo "VERSION=$VERSION"
            echo "PRERELEASE=$PRERELEASE"
          } >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build webui (embedded SPA)
        # every Go build below embeds whatever is in static/ - the real
        # SPA must be synced BEFORE the first go build
        run: |
          cd webui
          npm ci
          sh scripts/build.sh

      - name: Build Windows amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-windows_amd64/omega.exe ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-windows_amd64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-windows_amd64/
          cd dist && zip -r "omega-$VERSION-windows_amd64.zip" "omega-$VERSION-windows_amd64/"

      - name: Build Linux amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-linux_amd64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-linux_amd64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-linux_amd64/
          cd dist && tar czf "omega-$VERSION-linux_amd64.tar.gz" "omega-$VERSION-linux_amd64/"

      - name: Build macOS arm64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-darwin_arm64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-darwin_arm64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-darwin_arm64/
          cd dist && tar czf "omega-$VERSION-darwin_arm64.tar.gz" "omega-$VERSION-darwin_arm64/"

      - name: Build macOS amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-darwin_amd64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-darwin_amd64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-darwin_amd64/
          cd dist && tar czf "omega-$VERSION-darwin_amd64.tar.gz" "omega-$VERSION-darwin_amd64/"

      - name: Build Linux arm64 (Raspberry Pi)
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-linux_arm64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-linux_arm64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-linux_arm64/
          cd dist && tar czf "omega-$VERSION-linux_arm64.tar.gz" "omega-$VERSION-linux_arm64/"

      - name: Generate checksums
        # both filename shapes: the full release filename for current
        # updaters, plus bare platform-tag aliases so pre-Oct-16 binaries
        # (<= v0.6.0, suffix matcher) can still self-update (t_3d123470)
        run: scripts/release-checksums.sh dist

      - name: Generate release notes
        # deterministic counts + highlights from the round's commit log; the
        # one prose line rides the ANNOTATED tag message (empty annotation =
        # counts + highlights only - loud is nice, blocking on prose is not)
        #
        # continue-on-error: a headline-heavy cycle can still overflow the
        # Discord cap after every trimmable bullet is gone (release-notes.sh
        # exits 1 and writes dist/discord-exception.txt). The GitHub notes and
        # body are already on disk at that point, so the release must still
        # ship; the "Report Discord skip" step below makes the skip loud and
        # the Discord step's payload gate keeps the webhook silent. Any other
        # notes failure still shows up as a red step in the run.
        continue-on-error: true
        run: scripts/release-notes.sh "" "${{ steps.version.outputs.VERSION }}"

      - name: Compose release body
        # static asset sections + the story; generate_release_notes appends
        # the PR-listing notes after this body
        run: |
          cat > dist/release-body.md <<'EOF'
          ## omega ${{ steps.version.outputs.VERSION }}

          ### Downloads
          - **Windows**: `omega-${{ steps.version.outputs.VERSION }}-windows_amd64.zip`
          - **Linux**: `omega-${{ steps.version.outputs.VERSION }}-linux_amd64.tar.gz`
          - **Linux (arm64, e.g. Raspberry Pi)**: `omega-${{ steps.version.outputs.VERSION }}-linux_arm64.tar.gz`
          - **macOS (Apple Silicon)**: `omega-${{ steps.version.outputs.VERSION }}-darwin_arm64.tar.gz`
          - **macOS (Intel)**: `omega-${{ steps.version.outputs.VERSION }}-darwin_amd64.tar.gz`

          ### Install
          1. Download the archive for your OS
          2. Extract to a directory on your PATH
          3. Run `omega setup` on first install, then `omega` to start the CLI loop

          ### Update
          If you already have omega installed: `omega update`

          ## What changed

          EOF
          cat dist/release-notes-body.md >> dist/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          files: |
            dist/omega-${{ steps.version.outputs.VERSION }}-windows_amd64.zip
            dist/omega-${{ steps.version.outputs.VERSION }}-linux_amd64.tar.gz
            dist/omega-${{ steps.version.outputs.VERSION }}-linux_arm64.tar.gz
            dist/omega-${{ steps.version.outputs.VERSION }}-darwin_arm64.tar.gz
            dist/omega-${{ steps.version.outputs.VERSION }}-darwin_amd64.tar.gz
            dist/checksums.txt
          body_path: dist/release-body.md

      - name: Report Discord skip
        # release-notes.sh writes an exception report (never a payload) when
        # the post still overflows the 2000-char cap after trimming every
        # doc/tune bullet. Surface it as a warning annotation with the full
        # report; the release itself is unaffected.
        if: hashFiles('dist/discord-exception.txt') != ''
        run: |
          echo "::warning::Discord post skipped - see dist/discord-exception.txt"
          cat dist/discord-exception.txt

      - name: Post to Discord
        # the word is the marketing moment: nightlies soak quietly, only
        # stable releases announce. The payload file is generated in the
        # notes step - curl -d @file, never an inline -d string. No payload
        # file means an overflow skip: do not post (the report step above
        # already said why), and keep the rest of the job green.
        if: ${{ success() && steps.version.outputs.PRERELEASE == 'false' && hashFiles('dist/discord-release.json') != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d @dist/discord-release.json \
            "$DISCORD_WEBHOOK_URL"

  windows-smoke:
    # ponytail: prove the windows asset executes before users find out
    # it doesn't. Costs windows-runner minutes only when a release
    # exists. Ceiling named: version + one help call, not a suite.
    runs-on: windows-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Download and smoke the windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:GITHUB_REF_NAME" -R EndoTheDev/omega --pattern "omega-*windows_amd64.zip"
          Expand-Archive -Path "omega-*windows_amd64.zip" -DestinationPath smoke
          $exe = Get-ChildItem -Path smoke -Recurse -Filter omega.exe | Select-Object -First 1
          if (-not $exe) { throw "omega.exe not found in the windows asset" }
          & $exe.FullName --version
          & $exe.FullName run --help
