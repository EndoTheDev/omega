name: Release

on:
  push:
    tags: ["v*"]

jobs:
  desktop-windows:
    # every tag ships the Windows desktop asset, and it is built, packaged,
    # copy-booted and uploaded BEFORE the release job can publish anything:
    # the release job needs this job, so a red smoke here means no release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build webui (embedded SPA)
        shell: bash
        run: |
          cd webui
          npm ci
          sh scripts/build.sh

      - name: Build desktop
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          go build -ldflags "-H=windowsgui -X main.omegaVersion=$VERSION" -o dist/omega.exe ./cmd/omega

      - name: Package desktop asset
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/desktop-package.ps1 -Version "${{ steps.version.outputs.VERSION }}" -Exe dist/omega.exe -OutDir dist

      - name: Copy-boot the packaged asset
        # the gate: install the extracted tree for real, then boot the
        # INSTALLED exe against a copy of a seeded home and require a healthy
        # /health. Red here means the asset never reaches users.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.VERSION }}"
          $zip = "dist/omega-$version-windows-desktop.zip"
          $extract = Join-Path $env:RUNNER_TEMP 'omega-desktop-extract'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $installer = Get-ChildItem -Path $extract -Recurse -Filter install.ps1 | Select-Object -First 1
          if (-not $installer) { throw "install.ps1 missing from $zip" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }

          $dest = Join-Path $env:LOCALAPPDATA 'Programs\omega'
          $exe = Join-Path $dest 'omega.exe'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\omega.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\omega'
          if (-not (Test-Path $exe)) { throw "install.ps1 left no $exe" }
          if (-not (Test-Path $lnk)) { throw "install.ps1 left no Start Menu shortcut" }
          if (-not (Test-Path $key)) { throw "install.ps1 left no uninstall entry" }
          if (-not (Get-ItemProperty -Path $key).UninstallString) { throw "uninstall entry carries no UninstallString" }

          $seedHome = Join-Path $env:RUNNER_TEMP 'omega-home'
          New-Item -ItemType Directory -Force -Path (Join-Path $seedHome 'config') | Out-Null
          @'
          provider:
            model_name: smoke-model
            type: ollama
            host: http://127.0.0.1:11434
          server:
            port: 18247
          '@ | Set-Content -Path (Join-Path $seedHome 'config\config.yaml') -Encoding ascii
          $homeCopy = Join-Path $env:RUNNER_TEMP 'omega-home-copy'
          Copy-Item -Path $seedHome -Destination $homeCopy -Recurse

          $env:OMEGA_HOME = $homeCopy
          $out = & $exe desktop --headless-health 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "omega desktop --headless-health exited $LASTEXITCODE`n$out" }
          if ($out -notmatch '"status":"ok"') { throw "health body carries no status ok`n$out" }
          Write-Host $out

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dest 'uninstall.ps1')
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 exited $LASTEXITCODE" }
          if (Test-Path $exe) { throw "uninstall left $exe in place" }
          if (Test-Path $lnk) { throw "uninstall left the Start Menu shortcut in place" }
          if (Test-Path $key) { throw "uninstall left the uninstall entry in place" }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/omega-${{ steps.version.outputs.VERSION }}-windows-desktop.zip
          if-no-files-found: error

  release:
    needs: desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # full history + all tags: the release notes need the commit range
        # back to the previous stable tag and the tag annotation reads off
        # the checked-out tag object
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Determine version
        id: version
        # nightly tags (vX.Y.Z-nightly.*) ride the prerelease flag: they
        # sort BELOW their stable target and GitHub keeps them out of the
        # "Latest" release the updater's stable channel reads.
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PRERELEASE=false
          case "$VERSION" in *-nightly.*) PRERELEASE=true ;; esac
          {
            echo "VERSION=$VERSION"
            echo "PRERELEASE=$PRERELEASE"
          } >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build webui (embedded SPA)
        # every Go build below embeds whatever is in static/ - the real
        # SPA must be synced BEFORE the first go build
        run: |
          cd webui
          npm ci
          sh scripts/build.sh

      - name: Build Windows amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-windows_amd64/omega.exe ./cmd/omega
          cp cmd/omega/omega.cmd dist/omega-$VERSION-windows_amd64/
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-windows_amd64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-windows_amd64/
          cd dist && zip -r "omega-$VERSION-windows_amd64.zip" "omega-$VERSION-windows_amd64/"

      - name: Build Linux amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-linux_amd64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-linux_amd64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-linux_amd64/
          cd dist && tar czf "omega-$VERSION-linux_amd64.tar.gz" "omega-$VERSION-linux_amd64/"

      - name: Build macOS arm64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-darwin_arm64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-darwin_arm64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-darwin_arm64/
          cd dist && tar czf "omega-$VERSION-darwin_arm64.tar.gz" "omega-$VERSION-darwin_arm64/"

      - name: Build macOS amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-darwin_amd64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-darwin_amd64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-darwin_amd64/
          cd dist && tar czf "omega-$VERSION-darwin_amd64.tar.gz" "omega-$VERSION-darwin_amd64/"

      - name: Build Linux arm64 (Raspberry Pi)
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-linux_arm64/omega ./cmd/omega
          cp cmd/omega/examples/config.yaml.example dist/omega-$VERSION-linux_arm64/
          cp cmd/omega/examples/mcp.yaml.example dist/omega-$VERSION-linux_arm64/
          cd dist && tar czf "omega-$VERSION-linux_arm64.tar.gz" "omega-$VERSION-linux_arm64/"

      - name: Download the desktop asset
        # the windows job built, packaged and copy-booted it; checksums and
        # the published files list must see it in dist/
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/

      - name: Generate checksums
        # both filename shapes: the full release filename for current
        # updaters, plus bare platform-tag aliases so pre-Oct-16 binaries
        # (<= v0.6.0, suffix matcher) can still self-update (t_3d123470)
        run: scripts/release-checksums.sh dist

      - name: Restore the tag annotation
        # actions/checkout@v4 leaves refs/tags/<v> pointing at the COMMIT, not
        # the tag object: its all-history fetch brings the annotated tag, then
        # testRef compares github.sha (the peeled commit) against the tag
        # OBJECT sha, misses, and re-fetches `+<sha>:refs/tags/<v>` - a
        # lightweight ref. release-notes.sh then reads no annotation and ships
        # the post and the body without their prose paragraph (v0.17.1,
        # t_530c4635). Re-fetch the tag ref itself and fail loud if the remote
        # says annotated while the local ref is still a bare commit: a release
        # does not announce text nobody can read.
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags --no-recurse-submodules origin \
            "refs/tags/$VERSION:refs/tags/$VERSION"
          if git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" \
               | grep -qF "refs/tags/$VERSION^{}"; then
            if ! git rev-parse -q --verify "refs/tags/$VERSION^{tag}" >/dev/null; then
              echo "::error::refs/tags/$VERSION is annotated on the remote but the local ref is a bare commit - the release body would lose its prose paragraph"
              exit 1
            fi
            echo "annotation: $(git for-each-ref "refs/tags/$VERSION" --format='%(contents:subject)')"
          else
            echo "lightweight tag $VERSION - no annotation to read (no prose paragraph)"
          fi

      - name: Generate release notes
        # deterministic shape (t_42854d3e): a hook line, the round's bullets,
        # the counts. The hook and the bullet list ride the per-release
        # scripts/release-notes.overrides.md (preferred) or the ANNOTATED tag
        # message (fallback); with neither, the hook is a plain counts sentence
        # named on stderr - never a blank line, never invented behavior text.
        #
        # A post over the 2000-char Discord cap means a broken annotation:
        # release-notes.sh writes no payload and exits 1, so the job goes red
        # before anything is published - the release does not announce text
        # nobody can read. There is no trimmer behind the cap (t_878b1b7c):
        # the post is a release note, the full changelog lives in the body.
        run: scripts/release-notes.sh "" "${{ steps.version.outputs.VERSION }}"

      - name: Compose release body
        # static asset sections + the story; generate_release_notes appends
        # the PR-listing notes after this body
        run: |
          cat > dist/release-body.md <<'EOF'
          ## omega ${{ steps.version.outputs.VERSION }}

          ### Downloads
          - **Windows desktop** (app window, tray, start with Windows): `omega-${{ steps.version.outputs.VERSION }}-windows-desktop.zip`
          - **Windows**: `omega-${{ steps.version.outputs.VERSION }}-windows_amd64.zip`
          - **Linux**: `omega-${{ steps.version.outputs.VERSION }}-linux_amd64.tar.gz`
          - **Linux (arm64, e.g. Raspberry Pi)**: `omega-${{ steps.version.outputs.VERSION }}-linux_arm64.tar.gz`
          - **macOS (Apple Silicon)**: `omega-${{ steps.version.outputs.VERSION }}-darwin_arm64.tar.gz`
          - **macOS (Intel)**: `omega-${{ steps.version.outputs.VERSION }}-darwin_amd64.tar.gz`

          ### Install
          1. Download the archive for your OS
          2. Extract to a directory on your PATH
          3. Run `omega setup` on first install, then `omega` to start the CLI loop

          The Windows desktop archive is its own install: extract it, run
          `install.ps1` (copies to `%LOCALAPPDATA%\Programs\omega`, adds the Start
          Menu shortcut and an uninstall entry), then launch omega from the Start
          Menu. `uninstall.ps1` in the same folder removes it.

          ### Update
          If you already have omega installed: `omega update`

          ## What changed

          EOF
          cat dist/release-notes-body.md >> dist/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          files: |
            dist/omega-${{ steps.version.outputs.VERSION }}-windows-desktop.zip
            dist/omega-${{ steps.version.outputs.VERSION }}-windows_amd64.zip
            dist/omega-${{ steps.version.outputs.VERSION }}-linux_amd64.tar.gz
            dist/omega-${{ steps.version.outputs.VERSION }}-linux_arm64.tar.gz
            dist/omega-${{ steps.version.outputs.VERSION }}-darwin_arm64.tar.gz
            dist/omega-${{ steps.version.outputs.VERSION }}-darwin_amd64.tar.gz
            dist/checksums.txt
          body_path: dist/release-body.md

      - name: Post to Discord
        # the word is the marketing moment: nightlies soak quietly, only
        # stable releases announce. The payload file is generated in the
        # notes step - curl -d @file, never an inline -d string. No payload
        # file means the notes step broke the cap guard and the job is
        # already red; success() + the hashFiles gate keep the webhook silent
        # so a failed release can never announce itself.
        if: ${{ success() && steps.version.outputs.PRERELEASE == 'false' && hashFiles('dist/discord-release.json') != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d @dist/discord-release.json \
            "$DISCORD_WEBHOOK_URL"

  windows-smoke:
    # ponytail: prove the windows asset executes before users find out
    # it doesn't. Costs windows-runner minutes only when a release
    # exists. Ceiling named: version + one help call, not a suite.
    runs-on: windows-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Download and smoke the windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:GITHUB_REF_NAME" -R EndoTheDev/omega --pattern "omega-*windows_amd64.zip"
          Expand-Archive -Path "omega-*windows_amd64.zip" -DestinationPath smoke
          $exe = Get-ChildItem -Path smoke -Recurse -Filter omega.exe | Select-Object -First 1
          if (-not $exe) { throw "omega.exe not found in the windows asset" }
          # the wrapper waits for the GUI-subsystem exe; pwsh alone does not
          $omega = Join-Path $exe.DirectoryName 'omega.cmd'
          if (-not (Test-Path $omega)) { throw "omega.cmd missing from the windows asset" }
          & $omega --version; if ($LASTEXITCODE -ne 0) { throw "omega --version exited $LASTEXITCODE" }
          & $omega run --help; if ($LASTEXITCODE -ne 0) { throw "omega run --help exited $LASTEXITCODE" }
