name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Determine version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build Windows amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p dist/omega-$VERSION-windows_amd64/extensions
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-windows_amd64/omega.exe ./cmd/omega
          for ext in core-prompt core-provider core-store core-skills core-tools mcp-bridge ollama-web; do
            GOOS=windows GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o "dist/omega-$VERSION-windows_amd64/extensions/$ext.exe" ./bin/extensions/$ext/
          done
          cp bin/config.yaml.example dist/omega-$VERSION-windows_amd64/
          cp bin/mcp.yaml.example dist/omega-$VERSION-windows_amd64/
          cd dist && zip -r "omega-$VERSION-windows_amd64.zip" "omega-$VERSION-windows_amd64/"

      - name: Build Linux amd64
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p dist/omega-$VERSION-linux_amd64/extensions
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o dist/omega-$VERSION-linux_amd64/omega ./cmd/omega
          for ext in core-prompt core-provider core-store core-skills core-tools mcp-bridge ollama-web; do
            GOOS=linux GOARCH=amd64 go build -ldflags "-X main.omegaVersion=$VERSION" -o "dist/omega-$VERSION-linux_amd64/extensions/$ext" ./bin/extensions/$ext/
          done
          cp bin/config.yaml.example dist/omega-$VERSION-linux_amd64/
          cp bin/mcp.yaml.example dist/omega-$VERSION-linux_amd64/
          cd dist && tar czf "omega-$VERSION-linux_amd64.tar.gz" "omega-$VERSION-linux_amd64/"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/omega-${{ steps.version.outputs.VERSION }}-windows_amd64.zip
            dist/omega-${{ steps.version.outputs.VERSION }}-linux_amd64.tar.gz
          body: |
            ## omega ${{ steps.version.outputs.VERSION }}

            ### Downloads
            - **Windows**: `omega-${{ steps.version.outputs.VERSION }}-windows_amd64.zip`
            - **Linux**: `omega-${{ steps.version.outputs.VERSION }}-linux_amd64.tar.gz`

            ### Install
            1. Download the archive for your OS
            2. Extract to a directory on your PATH
            3. Run `omega` to start the TUI

            ### Update
            If you already have omega installed: `omega update`