<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omega</title>
<style>
/* ── Theme (Catppuccin; role-named so Endo can re-theme by editing this block) ── */
:root, [data-theme="dark"] {
  --bg: #1e1e2e;          /* base */
  --bg-2: #181825;        /* mantle */
  --surface: #313244;     /* surface0 */
  --surface-2: #45475a;   /* surface1 */
  --text: #cdd6f4;        /* text */
  --subtext: #a6adc8;     /* subtext0 */
  --info: #9399b2;        /* subtext1 */
  --user: #89b4fa;        /* blue */
  --thinking: #6c7086;    /* overlay0 */
  --tool: #fab387;         /* peach */
  --match: #cdd6f4;        /* text (bold) */
  --error: #f38ba8;        /* red */
  --border: #45475a;       /* surface1 */
  --accent: #89b4fa;       /* user blue */
}
[data-theme="light"] {
  --bg: #eff1f5;
  --bg-2: #e6e9ef;
  --surface: #ccd0da;
  --surface-2: #bcc0cc;
  --text: #4c4f69;
  --subtext: #5c5f77;
  --info: #7c7f93;
  --user: #1e66f5;
  --thinking: #8c8fa1;
  --tool: #fe640b;
  --match: #4c4f69;
  --error: #d20f39;
  --border: #bcc0cc;
  --accent: #1e66f5;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ── Header ── */
header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-2); }
.logo { font-weight:800; letter-spacing:1px; color:var(--accent); }
.status { font-size:12px; color:var(--info); margin-left:auto; }
.theme-toggle, .btn { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
.theme-toggle:hover, .btn:hover { background:var(--surface-2); }

/* ── Layout ── */
.main { flex:1; display:flex; min-height:0; }
.sidebar { width:260px; border-right:1px solid var(--border); background:var(--bg-2); display:flex; flex-direction:column; min-width:0; }
.sidebar h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--info); padding:12px 14px 6px; }
.session-list { flex:1; overflow-y:auto; }
.session { padding:8px 14px; cursor:pointer; border-left:2px solid transparent; font-size:13px; color:var(--subtext); }
.session:hover { background:var(--surface); }
.session.active { border-left-color:var(--accent); color:var(--text); background:var(--surface); }
.session .id { font-size:10px; color:var(--info); }
.sidebar .actions { padding:10px 14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }

/* ── Chat ── */
.chat { flex:1; display:flex; flex-direction:column; min-width:0; }
.log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:85%; padding:9px 13px; border-radius:10px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.msg.user { align-self:flex-end; background:var(--user); color:var(--bg-2); font-weight:600; }
.msg.assistant { align-self:flex-start; background:var(--surface); border:1px solid var(--border); }
.msg.tool { align-self:flex-start; background:var(--surface); border-left:3px solid var(--tool); font-family:monospace; font-size:12px; color:var(--subtext); }
.msg.thinking { align-self:flex-start; background:var(--surface); border-left:3px solid var(--thinking); font-size:12px; color:var(--thinking); font-style:italic; }
.msg.error { align-self:flex-start; background:var(--surface); border-left:3px solid var(--error); color:var(--error); }
.msg .lbl { font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:.6; margin-bottom:3px; }
.msg .caret { display:inline-block; width:8px; color:var(--accent); }

.inputbar { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
.inputbar input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; padding:11px 14px; outline:none; }
.inputbar input:focus { border-color:var(--accent); }
.inputbar button { background:var(--accent); color:var(--bg-2); border:none; border-radius:8px; padding:0 20px; font-size:14px; font-weight:700; cursor:pointer; }

.hint { font-size:11px; color:var(--info); padding:0 16px 8px; }
.hint code { background:var(--surface); border-radius:4px; padding:1px 5px; font-size:10px; }
</style>
</head>
<body>
<header>
  <div class="logo">omega</div>
  <div class="status" id="status"></div>
  <button class="theme-toggle" id="themeBtn">🌓</button>
</header>
<div class="main">
  <aside class="sidebar">
    <h3>Sessions</h3>
    <div class="session-list" id="sessionList"></div>
    <div class="actions">
      <button class="btn" id="newSess">+ New session</button>
      <button class="btn" id="refreshSess">⟳ Refresh</button>
    </div>
  </aside>
  <section class="chat">
    <div class="log" id="log"></div>
    <div class="hint"><code>/new</code> <code>/sessions</code> <code>/sessions delete &lt;id&gt;</code> <code>/resume &lt;id&gt;</code> <code>/models</code> <code>/theme</code> <code>/help</code> — anything else is sent to the agent.</div>
    <div class="inputbar">
      <input id="input" placeholder="Type a message, or a /command…" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </section>
</div>
<script>
'use strict';

/* ── State ── */
let currentSession = null;
let streaming = false;

/* ── DOM refs ── */
const logEl = document.getElementById('log');
const sessionListEl = document.getElementById('sessionList');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const themeBtn = document.getElementById('themeBtn');

/* ── Theme ── */
themeBtn.addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
});

/* ── Utils ── */
function logMsg(kind, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = kind;
  el.appendChild(lbl);
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}

/* ── API helpers ── */
async function api(path, options = {}) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let msg = res.status;
    try { const j = await res.json(); msg = j.error || j.message || msg; } catch (_) {}
    throw new Error('HTTP ' + res.status + ': ' + msg);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

/* Sessions */
async function loadSessions() {
  try {
    const sessions = await api('/sessions');
    sessionListEl.innerHTML = '';
    if (!sessions.length) {
      sessionListEl.innerHTML = '<div class="session">No sessions yet.</div>';
      return;
    }
    for (const s of sessions) {
      const el = document.createElement('div');
      el.className = 'session' + (s.id === currentSession ? ' active' : '');
      const label = s.label || '(unnamed)';
      el.innerHTML = '<div>' + escapeHtml(label) + '</div><div class="id">' + escapeHtml(s.id) + '</div>';
      el.addEventListener('click', () => resume(s.id));
      sessionListEl.appendChild(el);
    }
  } catch (e) {
    statusEl.textContent = 'Error loading sessions: ' + e.message;
  }
}

async function newSession() {
  try {
    const s = await api('/sessions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    currentSession = s.id;
    logEl.innerHTML = '';
    await loadSessions();
    statusEl.textContent = 'New session ' + s.id;
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
  }
}

async function resume(id) {
  currentSession = id;
  logEl.innerHTML = '';
  statusEl.textContent = 'Resumed ' + id;
  await loadSessions();
}

async function deleteSession(id) {
  try {
    await api('/sessions/' + id, { method: 'DELETE' });
    if (currentSession === id) currentSession = null;
    await loadSessions();
    statusEl.textContent = 'Deleted ' + id;
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
  }
}

/* Chat with SSE streaming */
async function chat(text) {
  if (streaming) return;
  logMsg('user', text);
  const assistantEl = document.createElement('div');
  assistantEl.className = 'msg assistant';
  const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = 'assistant';
  assistantEl.appendChild(lbl);
  const span = document.createElement('span');
  assistantEl.appendChild(span);
  logEl.appendChild(assistantEl);
  logEl.scrollTop = logEl.scrollHeight;

  streaming = true;
  statusEl.textContent = 'thinking…';

  const body = {
    session_id: currentSession,
    messages: [{ role: 'user', content: text }],
  };
  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) { streaming = false; span.textContent = 'HTTP ' + res.status; span.className = 'error'; return; }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    // Process complete SSE frames
    let idx;
    while ((idx = buffer.indexOf('\n\n')) !== -1) {
      const frame = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      handleSSE(frame, span);
    }
  }
  streaming = false;
  statusEl.textContent = currentSession ? 'session ' + currentSession : 'connected';
}

function handleSSE(frame, span) {
  let eventType = 'message';
  const dataLines = [];
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) eventType = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
  }
  const data = dataLines.join('\n');
  if (!data || data === '[DONE]') return;
  let ev;
  try { ev = JSON.parse(data); } catch (_) { return; }
  if (eventType === 'response_chunk' && ev.content) {
    span.textContent += ev.content;
    logEl.scrollTop = logEl.scrollHeight;
  } else if (eventType === 'tool_call') {
    const tc = ev.tool_call || {};
    logMsg('tool', 'tool call: ' + (tc.name || '?'));
  }
}

/* ── Commands (mirrors TUI surface that the gateway supports) ── */
async function handleCommand(text) {
  const fields = text.split(/\s+/);
  const cmd = fields[0];
  switch (cmd) {
    case '/new': await newSession(); return true;
    case '/sessions':
      if (fields[1] === 'delete') { await deleteSession(fields[2]); }
      else await loadSessions();
      return true;
    case '/resume': await resume(fields[1]); return true;
    case '/models': {
      try {
        const d = await api('/models');
        logMsg('info', 'current: ' + d.current + '\n' + (d.models || []).join('\n'));
      } catch (e) { logMsg('error', e.message); }
      return true;
    }
    case '/help':
      logMsg('info', 'Commands: /new, /sessions, /sessions delete <id>, /resume <id>, /models, /theme, /help');
      return true;
    case '/theme':
      themeBtn.click();
      return true;
    default:
      return false;
  }
}

/* ── Input ── */
async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  if (text.startsWith('/')) {
    const handled = await handleCommand(text);
    if (!handled) logMsg('info', 'Unknown command: ' + text.split(' ')[0] + '. Try /help.');
  } else {
    await chat(text);
  }
}
sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

/* ── Init ── */
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.addEventListener('DOMContentLoaded', async () => {
  await loadSessions();
  statusEl.textContent = 'connected';
});
</script>
</body>
</html>
